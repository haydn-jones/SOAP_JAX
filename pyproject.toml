[project]
name = "soap-jax"
version = "0.1.0"
description = "SOAP Optimizer implemented in JAX"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = ["jax", "jaxtyping", "optax"]

[build-system]
requires = ["uv_build>=0.8.5"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "SIM", "I", "FURB"]
ignore = ["B905"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = ["flax>=0.10.7", "jax[cuda13]>0.6.0"]
