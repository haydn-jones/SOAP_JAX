[project]
name = "soap-jax"
version = "0.2.2"
description = "SOAP Optimizer implemented in JAX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jax", "jaxtyping", "optax", "chex"]

[build-system]
requires = ["uv_build>=0.8.5"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "SIM", "I", "FURB"]
ignore = ["B905"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
cuda13 = ["jax[cuda13]==0.11.1"]
dev = [
    "equinox==0.13.8",
    "jax==0.11.1",
    "flax==0.12.9",
    "optax==0.2.8",
    "orbax-checkpoint==0.12.4",
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.dependency-groups]
dev = {requires-python = ">=3.12"}
cuda13 = {requires-python = ">=3.12"}
